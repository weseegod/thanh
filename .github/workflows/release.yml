# Build the fork's `thanh` binary for every supported platform and publish a
# GitHub Release with per-platform assets that the built-in updater consumes:
#
#   - `stable` / `alpha`        : plain-text semver channel pointers (the
#                                 updater fetches `releases/latest/download/{channel}`)
#   - `thanh-<ver>-<os>-<arch>` : the binaries (e.g. thanh-0.2.122-macos-aarch64)
#   - `*.sha256`                : checksums
#
# Canonical flow: `scripts/publish_release.sh` bumps the version, tags `vX.Y.Z`
# and pushes → this workflow builds the matrix and publishes the release.
# `workflow_dispatch` is a manual alternative (pass the version as input).

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.122). Leave empty to read from the tag when pushing a v* tag."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-14 # arm64 (Apple Silicon / M1)
            platform: macos-aarch64
          # Optional Intel macOS / Windows (best-effort):
          # - os: macos-13
          #   platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dotslash (hermetic protoc via bin/protoc)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install dotslash --locked

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Manual dispatch without an explicit version: use the lockstepped
            # version already in the tree.
            echo "version=$(grep -m1 '^version = ' crates/codegen/xai-grok-version/Cargo.toml | sed -E 's/^version = \"([^\"]+)\"/\1/')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binary
        env:
          GROK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build -p xai-grok-pager-bin --release
          asset="thanh-${{ steps.version.outputs.version }}-${{ matrix.platform }}"
          cp target/release/xai-grok-pager "$asset"
          chmod +x "$asset"
          "$asset" --version
          shasum -a 256 "$asset" > "$asset.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: thanh-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: |
            thanh-*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep -m1 '^version = ' crates/codegen/xai-grok-version/Cargo.toml | sed -E 's/^version = \"([^\"]+)\"/\1/')" >> "$GITHUB_OUTPUT"
          fi

      - name: Write channel pointers
        run: |
          printf '%s\n' "${{ steps.version.outputs.version }}" > dist/stable
          printf '%s\n' "${{ steps.version.outputs.version }}" > dist/alpha

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          # `gh release create` creates the tag itself when missing (manual
          # dispatch); on a tag push it already exists. Fall back to `edit`
          # if the release was created by a previous run.
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$tag" --generate-notes \
          || gh release edit "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "$tag"
